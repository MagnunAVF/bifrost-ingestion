name: CI
on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with: { go-version-file: go.mod }
            - uses: golangci/golangci-lint-action@v7 # v7+ supports golangci-lint v2
              with: { version: latest } # pin a version for reproducible builds
            - run: make sqlc-diff # skips until internal/catalog/queries has SQL
            - run: go mod tidy -diff
            - run: make test # go test -race + scripts/eng-issue_test.sh
            - run: make vuln
