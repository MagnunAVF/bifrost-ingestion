name: Release
on:
    push:
        tags: ["v*.*.*"]
permissions:
    contents: write
jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - name: Tag must point to a commit on main
              run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Release tags must be on main"; exit 1; }
            - uses: actions/setup-go@v5
              with: { go-version-file: go.mod }
            - run: go test -race -count=1 ./...
            - uses: goreleaser/goreleaser-action@v6
              with:
                  version: "~> v2"
                  args: release --clean --release-notes docs/releases/${{ github.ref_name }}.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
