version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - errorlint
    - gosec # includes SQL string-building checks (G201/G202)
    - revive
    - misspell
  settings:
    depguard:
      rules:
        vector-stdlib-only:
          list-mode: strict
          files: ["**/internal/vector/**", "!$test"]
          allow: [$gostd]
        sql-only-in-catalog:
          files:
            - "**/internal/ingest/**"
            - "**/internal/embed/**"
            - "**/internal/vector/**"
            - "**/internal/dedup/**"
            - "!$test"
          deny:
            - pkg: database/sql
              desc: "SQL lives in internal/catalog"
            - pkg: modernc.org/sqlite
              desc: "SQLite lives in internal/catalog"
        ingest-is-offline:
          files: ["**/internal/ingest/**"]
          deny:
            - pkg: net/http
              desc: "ingest only parses and sanitizes"
formatters:
  enable:
    - gofumpt
    - goimports
