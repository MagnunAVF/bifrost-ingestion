version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/catalog/migrations" # or "internal/catalog/schema.sql" (make schema)
    queries: "internal/catalog/queries"
    gen:
      go:
        package: "db"
        out: "internal/catalog/db"
        rename: # sqlc lowercases the legacy PascalCase identifiers
          sellerproduct: "SellerProduct"
          sellername: "SellerName"
          productid: "ProductID"
          sellerproductid: "SellerProductID"
